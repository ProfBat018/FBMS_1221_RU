apiVersion: v1
kind: Service
metadata:
  name: redis-sql-service
spec:
  selector:
    app: redis-example
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
    - name: web-api
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: ms-sql
      protocol: TCP
      port: 1433
      targetPort: 1433
  type: LoadBalancer
